openapi: 3.0.3
info:
  title: Mock User API
  version: 1.0.0
  description: A simple mock API for demonstrating endpoint analysis
paths:
  /users:
    get:
      summary: List users
      description: Retrieves a paginated list of users with optional filtering by role.
      operationId: listUsers
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of users per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: role
          in: query
          description: Filter users by role
          required: false
          schema:
            type: string
            enum: [admin, user, guest]
      responses:
        '200':
          description: Successful response with list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
                    description: Total number of users matching filter
                  page:
                    type: integer
                  limit:
                    type: integer
        '400':
          description: Invalid query parameters
        '500':
          description: Internal server error
components:
  schemas:
    User:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user, guest]
          default: user
        created_at:
          type: string
          format: date-time